events {
	worker_connections 1024;
}


# Main http context
http {
    underscores_in_headers on; # Allow headers with underscores (like access_token)
    # Define an upstream server block for your FastAPI application
    # 'fastapi_service' matches the service name in docker-compose.yml
    # '8000' matches the internal port defined in the FastAPI Dockerfile/CMD
    upstream fastapi_backend {
        server chart_fastapi:8000;
    }

    server {
        listen 80;
        # Replace with your VPS IP or domain name if you have one
        server_name localhost;  # Add your domain if you configure DNS

        # Increase max body size if needed for file uploads etc.
        client_max_body_size 100M;

        location / {
            proxy_pass http://fastapi_backend; # Pass requests to the upstream block

            # Set headers to pass information to the backend application
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preserve the original headers
            proxy_pass_request_headers on;

            # Add these to ensure auth headers aren't dropped
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_pass_header access_token;
            proxy_set_header access_token $http_access_token;

            # WebSocket support (if your FastAPI app uses WebSockets)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

    }
}
